apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthai-frontend
  template:
    metadata:
      labels:
        app: healthai-frontend
    spec:
      containers:
      - name: healthai-frontend
        image: 633193633631.dkr.ecr.us-east-1.amazonaws.com/healthai-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: healthai-frontend-service
spec:
  type: NodePort
  selector:
    app: healthai-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30007
