apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthai-backend
  template:
    metadata:
      labels:
        app: healthai-backend
    spec:
      containers:
      - name: healthai-backend
        image: 633193633631.dkr.ecr.us-east-1.amazonaws.com/healthai-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: healthai-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: healthai-backend-service
spec:
  selector:
    app: healthai-backend
  ports:
  - port: 8080
    targetPort: 8080
